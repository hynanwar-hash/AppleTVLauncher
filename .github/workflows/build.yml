name: Build AppleTV Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Apple TV Launcher Project
        run: |
          mkdir -p app/src/main/java/com/anouarpro/appletvlauncher

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppleTVLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.anouarpro.appletvlauncher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.anouarpro.appletvlauncher"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:label="AppleTV Launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/anouarpro/appletvlauncher/MainActivity.kt
          package com.anouarpro.appletvlauncher

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          data class AppEntry(
              val label: String,
              val packageName: String,
              val icon: Drawable?,
              val isSettingsCard: Boolean = false
          )

          class MainActivity : Activity() {

              private lateinit var rootContainer: FrameLayout
              private var isSettingsOpen = false
              private var currentBgColors = intArrayOf(Color.parseColor("#050508"), Color.parseColor("#121420"))
              private var gridColumns = 5

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  rootContainer = FrameLayout(this)
                  setContentView(rootContainer)
                  renderLauncherHome()
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      resources.displayMetrics
                  ).toInt()

              private fun makeGlassDrawable(
                  fillColor: Int,
                  strokeColor: Int,
                  strokeWidthDp: Int,
                  radiusDp: Int
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = dp(radiusDp).toFloat()
                      setColor(fillColor)
                      setStroke(dp(strokeWidthDp), strokeColor)
                  }
              }

              private fun renderLauncherHome() {
                  isSettingsOpen = false
                  rootContainer.removeAllViews()

                  val bgGradient = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      currentBgColors
                  )
                  rootContainer.background = bgGradient

                  val scrollView = ScrollView(this).apply {
                      isFillViewport = true
                      isVerticalScrollBarEnabled = false
                  }

                  val mainColumn = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(36), dp(28), dp(36), dp(36))
                  }

                  val headerRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val titleText = TextView(this).apply {
                      text = " tvOS Launcher"
                      setTextColor(Color.WHITE)
                      textSize = 22f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0,
